# Build tools for this repository. Run them through mise (`mise exec -- …`),
# so every machine builds with the same Node.js and pnpm.
[tools]
node = "24.22.1"
pnpm = "12.4.2"
# 1.24.3 misparses TypeScript method bodies and reports whole class sections
# as one over-complex function, so the complexity gate judges the wrong code.
"pipx:lizard" = "1.24.1"
