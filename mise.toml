# Build and check tools for this repository. Run them through mise (`mise exec -- …`),
# so every machine builds and runs checks with the same pinned releases.
[tools]
node = "24.22.3"
pnpm = "12.22.0"
markdownlint-cli2 = "0.24.1"
shfmt = "3.14.1"
# 1.24.3 misparses TypeScript method bodies and reports whole class sections
# as one over-complex function, so the complexity gate judges the wrong code.
"pipx:lizard" = "1.24.1"
