# pnpm settings for the plugin's own dependencies (package.json, pnpm-lock.yaml).

# Supply-chain guard: a version must be public for 14 days (in minutes)
# before pnpm resolves it, so a hijacked release is usually found and pulled
# first. Strict: resolution fails instead of picking an older version quietly.
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true

# A flat node_modules: the build keeps symlinks (vite.config.ts), so every
# package, also a dependency of a dependency, must be found by a plain walk
# up from node_modules.
nodeLinker: hoisted

# Install scripts stay off, and a package that asks for one stops the install:
# none of these packages needs one to build.
strictDepBuilds: true
# buzz-app's composer code is written against these exact versions, which its
# own lockfile pins. A newer one in a nested dependency breaks its types.
overrides:
  mdast-util-from-markdown: 2.0.3
  mdast-util-to-markdown: 2.1.2
